name: Update Scoop Bucket

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release tag to publish to Scoop, for example v1.9.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-bucket:
    if: vars.SCOOP_BUCKET_REPO != '' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request manifest update
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "SCOOP_BUCKET_TOKEN secret is not configured." >&2
            exit 1
          fi

          gh api --method POST "repos/$BUCKET_REPO/dispatches" \
            -f event_type=update-manifest \
            -f 'client_payload[app]=codex-manage' \
            -f "client_payload[version]=$VERSION"
          echo "Requested codex-manage $VERSION; follow validation and publishing at https://github.com/$BUCKET_REPO/actions/workflows/update-manifest.yml"
