name: Update Homebrew Tap

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release tag to publish to Homebrew, for example v1.9.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    if: vars.HOMEBREW_TAP_REPO != '' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not configured." >&2
            exit 1
          fi

          gh api --method POST "repos/$TAP_REPO/dispatches" \
            -f event_type=update-formula \
            -f 'client_payload[formula]=codex-manage' \
            -f "client_payload[version]=$VERSION"
          echo "Requested codex-manage $VERSION; follow validation and publishing at https://github.com/$TAP_REPO/actions/workflows/update-formula.yml"
