no_tty: true

pre-commit:
  parallel: false
  commands:
    go-format:
      glob: "*.go"
      run: go tool -modfile tools.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint fmt
      stage_fixed: true
    golangci-lint:
      glob:
        - "*.{go,mod,sum,yml}"
        - Makefile
      run: go tool -modfile tools.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint run
    go-test:
      glob:
        - "*.{go,mod,sum,yml}"
        - Makefile
      run: go test -race -count=1 ./...
    nilaway:
      glob:
        - "*.{go,mod,sum,yml}"
        - Makefile
      run: go tool -modfile tools.mod go.uber.org/nilaway/cmd/nilaway -include-pkgs="codex-manage" ./...
    go-modules:
      glob:
        - "*.{go,mod,sum,yml}"
        - Makefile
      run: go mod tidy -diff && go mod verify && go mod verify -modfile=tools.mod
    cross-build:
      glob:
        - "*.{go,mod,sum,yml}"
        - Makefile
      run: make cross-build

commit-msg:
  commands:
    conventional-commits:
      run: |
        grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,72}' {1}
      fail_text: "Commit message does not follow Conventional Commits format (e.g., 'feat(scope): description')"
